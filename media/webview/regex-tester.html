<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="{{csp}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{webviewUri:media/webview/regex-tester.css}}" />
    <title>{{title}}</title>
  </head>
  <body>
    <form id="form" autocomplete="off">
      <div class="row">
        <label class="field grow">
          <span class="label">{{patternLabel}}</span>
          <input id="pattern" type="text" spellcheck="false" placeholder="(\w+)@example\.com" />
        </label>
        <label class="field flags">
          <span class="label">{{flagsLabel}}</span>
          <input id="flags" type="text" spellcheck="false" maxlength="8" placeholder="gi" />
        </label>
      </div>

      <div class="row">
        <span class="label grow" id="subject-label">{{subjectLabel}}</span>
        <button id="from-editor" type="button" class="secondary">{{fromEditorLabel}}</button>
        <button id="from-file" type="button" class="secondary">{{fromFileLabel}}</button>
        <button id="from-glob" type="button" class="secondary">{{fromGlobLabel}}</button>
      </div>
      <textarea id="subject" spellcheck="false" rows="8" aria-labelledby="subject-label"></textarea>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <pre id="highlight" class="highlight" aria-hidden="true"></pre>
    <ol id="matches" class="matches"></ol>

    <!-- Bundled from src/webview/regex-tester.ts; the kit's RPC client is inside. -->
    <script nonce="{{nonce}}" src="{{webviewUri:dist/webview/regex-tester.js}}"></script>
  </body>
</html>
