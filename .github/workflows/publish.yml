name: Publish Extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails if a source string is missing from the message bundle, or missing a
      # Japanese translation — both invisible when running in English.
      - name: Check localisation bundles
        run: npm run check:l10n

      - name: Test
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies --out quick-utils.vsix

      - name: Verify VSIX contents and run the packaged worker
        run: node scripts/verify-vsix.mjs quick-utils.vsix

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --packagePath quick-utils.vsix -p ${{ secrets.VSCE_PAT }}
