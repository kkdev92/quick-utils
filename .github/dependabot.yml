version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

    ignore:
      # Each of these is turned down on purpose, so the reasons live here
      # instead of being rediscovered every week.

      # typescript 7.x: `typescript-eslint` declares `typescript >=4.8.4 <6.1.0`,
      # and type-aware linting is what `lint` runs — so 7.x fails the lane
      # outright rather than degrading. Drop this once that peer range widens.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # @types/vscode moves by hand, in the same change as engines.vscode:
      # `vsce package` refuses types newer than the floor, so a bump on its own
      # turns the package lane red. The floor follows @kkdev92/vscode-ext-kit's,
      # which rises when the kit starts using an API older VS Code lacks, not
      # whenever new types are published. Raise both when a kit release raises
      # its floor, or when this extension needs a newer API itself.
      - dependency-name: "@types/vscode"

      # @types/node: these types decide what Node API the code may compile
      # against, so they must not exceed the Node of the oldest VS Code this
      # extension accepts. `engines.vscode: ^1.138.0` makes that VS Code 1.138,
      # whose extension host is Electron 42.10.0 with Node 24.18.1 (`target` in
      # microsoft/vscode's .npmrc at the 1.138.0 tag, then Electron's release
      # list). A bump past that passes CI — nothing reaches for a newer API *yet*
      # — which is precisely why CI cannot be what catches it. Same rule as
      # @types/vscode, where the types floor is also the ceiling. Majors are held
      # outright, and the range holds back minors past that Node: @types/node
      # 24.x went from 24.13 straight to 24.19, which is already past it.
      # Revisit when the floor moves: look up the new floor's Node the same way
      # and move the range to just past it.
      - dependency-name: "@types/node"
        versions:
          - ">=24.19.0"
        update-types:
          - version-update:semver-major

      # vitest 5.x: held here for this repository's own integration test, not
      # for the framework — the kit's own suite passes on vitest 5, and so do
      # both sibling extensions. test/integration/extension.test.ts loads the
      # built CJS bundle and patches `Module._load` to hand it the mock imported
      # from `@kkdev92/vscode-ext-kit/testing/vitest`; this repository also
      # merges the kit's Vitest config, which aliases `vscode`, into that same
      # project. On vitest 4 the bundle and the test see one mock. On vitest 5
      # they do not — six assertions read a mock that recorded nothing — while
      # the sibling that patches `Module._load` without merging the alias passes.
      # Drop this once the integration project hands the bundle its mock in a
      # way vitest 5 honours.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - version-update:semver-major

  # Actions are pinned to commit SHAs, which a person cannot reasonably keep current by
  # hand. Dependabot reads the version from the trailing comment and updates both, so the
  # pinning stays a safeguard rather than becoming a way to stay on old code forever.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
